[pytest]
; Run the automated suite with a plain `pytest -v` command from the
; project root. `pythonpath = .` makes the `backend` package
; importable (the tests import backend.* modules directly), and
; `testpaths = tests` keeps the standalone backend demo scripts
; (backend/multimodal/test_*.py, backend/rag/test_rag.py, ...)
; out of pytest collection. Those scripts are still runnable
; directly with `python -m backend.<module>`.
pythonpath = .
testpaths = tests
